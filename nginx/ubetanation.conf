# Nginx configuration for Ubetanation Landing Page
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=contact:10m rate=1r/m;

# Upstream for Next.js application
upstream nextjs_backend {
    server 127.0.0.1:3002;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ubetanation.com www.ubetanation.com;
    
    # Security headers for HTTP
    add_header X-Robots-Tag noindex always;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ubetanation.com www.ubetanation.com;
    
    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ubetanation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubetanation.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ubetanation.com/chain.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_ecdh_curve secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=(), accelerometer=(), gyroscope=(), magnetometer=(), ambient-light-sensor=()" always;
    
    # Content Security Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://vercel.live https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;
    
    # Basic Settings
    root /var/www/ubetanation-landing-page;
    index index.html index.htm;
    
    # Logging
    access_log /var/log/nginx/ubetanation.access.log;
    error_log /var/log/nginx/ubetanation.error.log warn;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # Brotli Compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    
    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        # CORS for fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Access-Control-Allow-Origin "*";
        }
    }
    
    # Next.js static files
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API routes with stricter rate limiting
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        
        # Special rate limiting for contact form
        location /api/contact {
            limit_req zone=contact burst=2 nodelay;
            proxy_pass http://nextjs_backend;
            include /etc/nginx/proxy_params;
        }
        
        proxy_pass http://nextjs_backend;
        include /etc/nginx/proxy_params;
    }
    
    # Health check endpoint
    location /api/health {
        access_log off;
        proxy_pass http://nextjs_backend;
        include /etc/nginx/proxy_params;
    }
    
    # Sitemap and robots.txt
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        expires 1d;
        add_header Cache-Control "public";
        proxy_pass http://nextjs_backend;
        include /etc/nginx/proxy_params;
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(env|git|gitignore|md|txt)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Main application
    location / {
        # Cache HTML files for a short time
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public";
        }
        
        proxy_pass http://nextjs_backend;
        include /etc/nginx/proxy_params;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
    
    location = /404.html {
        proxy_pass http://nextjs_backend;
        include /etc/nginx/proxy_params;
    }
    
    location = /500.html {
        proxy_pass http://nextjs_backend;
        include /etc/nginx/proxy_params;
    }
}

# Additional security: Block known bad user agents
map $http_user_agent $blocked_agent {
    default 0;
    ~*malicious 1;
    ~*bot 0; # Allow legitimate bots
    ~*crawler 0; # Allow legitimate crawlers
    ~*spider 0; # Allow search engine spiders
}

# Redirect www to non-www (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ubetanation.com;
    
    ssl_certificate /etc/letsencrypt/live/ubetanation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubetanation.com/privkey.pem;
    
    return 301 https://ubetanation.com$request_uri;
}